<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZHI | Assignments &amp; Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="/css/student-portal.css">
<style>
  .note-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .note-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; transition: .2s; }
  .note-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(15,23,42,.08); }
  .note-icon { width: 42px; height: 42px; border-radius: 10px; background: #dbeafe; color: var(--primary); display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px; }
  .note-title { font-weight: 700; margin-bottom: 4px; }
  .note-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
</style>
<script src="/js/auth-client.js"></script>
</head>
<body>
<main class="main-wrapper" id="zsMain">
  <div class="content">
    <h1 class="page-title"><i class='bxs-book-content bx'></i>Assignments &amp; Notes</h1>
    <p class="section-subtitle">Study materials your teachers have uploaded for your semester.</p>

    <div class="mb-3">
      <input id="q" class="form-control" placeholder="Search by subject or title…" style="max-width:360px;">
    </div>
    <div id="grid" class="note-grid"></div>
  </div>
</main>

<script src="/js/student-portal.js"></script>
<script>
(async () => {
  await ZS.mount({ active: 'assignments', pageTitle: 'Assignments & Notes' });

  let all = [];
  function render() {
    const q = document.getElementById('q').value.toLowerCase();
    const grid = document.getElementById('grid');
    const filtered = all.filter(n =>
      !q || (n.subject || '').toLowerCase().includes(q) || (n.title || '').toLowerCase().includes(q)
    );
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="bx bx-file"></i><br>No matching materials.</div>';
      return;
    }
    grid.innerHTML = filtered.map(n => `
      <div class="note-card">
        <div class="note-icon"><i class='bx bxs-file-doc'></i></div>
        <div class="note-title">${n.title || 'Untitled'}</div>
        <div class="note-meta"><i class='bx bx-book'></i> ${n.subject || '—'} · ${ZS.fmtDate(n.date || n.createdAt)}</div>
        <a href="${n.fileUrl}" target="_blank" class="btn btn-primary" style="width:100%;justify-content:center;">
          <i class='bx bx-download'></i> Download
        </a>
      </div>
    `).join('');
  }

  try {
    all = (await ZS.apiGet('/student/assignments')).data || [];
    render();
  } catch (err) { ZS.toast(err.message, 'error'); }
  document.getElementById('q').addEventListener('input', render);
})();
</script>
</body>
</html>
