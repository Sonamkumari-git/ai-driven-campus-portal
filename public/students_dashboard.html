<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZHI | Student Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="/css/student-portal.css">
<script src="/js/auth-client.js"></script>
</head>
<body>
<main class="main-wrapper" id="zsMain">
  <div class="content">
    <h1 class="page-title"><i class='bx bxs-dashboard'></i>Welcome, <span id="welcomeName">Student</span></h1>
    <p class="section-subtitle">Here's a snapshot of your academic life at ZHI.</p>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue"><i class='bx bx-calendar-check'></i></div>
        <div class="stat-info">
          <h4 id="statAttendance">—</h4>
          <p>Overall Attendance</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class='bx bx-award'></i></div>
        <div class="stat-info">
          <h4 id="statPct">—</h4>
          <p>Latest Exam Score</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class='bx bx-money'></i></div>
        <div class="stat-info">
          <h4 id="statDue">—</h4>
          <p>Fees Due</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple"><i class='bx bx-mail-send'></i></div>
        <div class="stat-info">
          <h4 id="statLeave">—</h4>
          <p>Pending Leaves</p>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-header">
          <h3><i class='bx bx-line-chart'></i> Attendance by Subject</h3>
        </div>
        <div class="panel-body">
          <div class="chart-container"><canvas id="attChart"></canvas></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h3><i class='bx bx-trophy'></i> Recent Exam Results</h3>
          <a href="/student_results" class="btn btn-outline" style="padding:6px 12px;font-size:12px;">View All</a>
        </div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Exam</th><th>Subject</th><th>Score</th><th>Rank</th></tr></thead>
            <tbody id="examsBody"><tr><td colspan="4" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="panel mt-3">
      <div class="panel-header">
        <h3><i class='bx bx-news'></i> Notices &amp; Announcements</h3>
      </div>
      <div class="panel-body" id="noticesBody">Loading…</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/js/student-portal.js"></script>
<script>
(async () => {
  const user = await ZS.mount({ active: 'dashboard', pageTitle: 'Dashboard' });
  document.getElementById('welcomeName').textContent = (user && user.name) || 'Student';

  try {
    const summary = (await ZS.apiGet('/student/dashboard-summary')).data;
    document.getElementById('statAttendance').textContent = summary.attendance.percentage + '%';
    document.getElementById('statDue').textContent = ZS.fmtMoney(summary.fees.totalDue);
    document.getElementById('statLeave').textContent = summary.pendingLeaves;
    const latest = summary.latestExams[0];
    document.getElementById('statPct').textContent = latest
      ? `${latest.marksObtained}/${latest.maxMarks}`
      : 'N/A';

    const examsBody = document.getElementById('examsBody');
    examsBody.innerHTML = '';
    if (!summary.latestExams.length) {
      examsBody.innerHTML = '<tr><td colspan="4" class="empty-state"><i class="bx bx-info-circle"></i><br>No published results yet.</td></tr>';
    } else {
      summary.latestExams.forEach(e => {
        examsBody.insertAdjacentHTML('beforeend', `
          <tr>
            <td>${e.examName}</td>
            <td>${e.subject}</td>
            <td><b>${e.marksObtained}</b> / ${e.maxMarks}</td>
            <td><span class="badge badge-info">#${e.rank || '-'}</span></td>
          </tr>
        `);
      });
    }
  } catch (err) { ZS.toast(err.message, 'error'); }

  try {
    const att = (await ZS.apiGet('/student/attendance')).subjectStats || [];
    const labels = att.map(s => s.subject);
    const values = att.map(s => s.percentage);
    new Chart(document.getElementById('attChart').getContext('2d'), {
      type: 'bar',
      data: {
        labels: labels.length ? labels : ['No data'],
        datasets: [{
          label: 'Attendance %',
          data: values.length ? values : [0],
          backgroundColor: values.map(v => v >= 75 ? '#10b981' : v >= 60 ? '#f59e0b' : '#ef4444'),
          borderRadius: 8
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, max: 100 } },
        plugins: { legend: { display: false } }
      }
    });
  } catch (err) { ZS.toast(err.message, 'error'); }

  try {
    const notices = (await ZS.apiGet('/student/notices')).data || [];
    const box = document.getElementById('noticesBody');
    if (!notices.length) {
      box.innerHTML = '<div class="empty-state"><i class="bx bx-info-circle"></i><br>No notices right now.</div>';
      return;
    }
    box.innerHTML = notices.slice(0, 6).map(n => `
      <div style="padding:12px 0;border-bottom:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b>${n.title || n.subject || 'Notice'}</b>
          <span style="font-size:11px;color:var(--text-muted);">${ZS.fmtDate(n.createdAt || n.date)}</span>
        </div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">${n.message || n.body || n.description || ''}</div>
      </div>
    `).join('');
  } catch (err) { /* silent */ }
})();
</script>
</body>
</html>
