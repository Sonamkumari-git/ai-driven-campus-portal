<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZHI | Exam Results</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="/css/student-portal.css">
<script src="/js/auth-client.js"></script>
</head>
<body>
<main class="main-wrapper" id="zsMain">
  <div class="content">
    <h1 class="page-title"><i class='bx bx-award'></i>Exam Results</h1>
    <p class="section-subtitle">Only published results are shown. Contact your HOD for corrections.</p>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon blue"><i class='bx bx-book-alt'></i></div>
        <div class="stat-info"><h4 id="totalExams">0</h4><p>Exams Attempted</p></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class='bx bx-check-shield'></i></div>
        <div class="stat-info"><h4 id="totalGot">0</h4><p>Marks Obtained</p></div></div>
      <div class="stat-card"><div class="stat-icon purple"><i class='bx bx-target-lock'></i></div>
        <div class="stat-info"><h4 id="totalMax">0</h4><p>Total Max Marks</p></div></div>
      <div class="stat-card"><div class="stat-icon orange"><i class='bx bx-trending-up'></i></div>
        <div class="stat-info"><h4 id="overallPct">0%</h4><p>Overall %</p></div></div>
    </div>

    <div class="panel">
      <div class="panel-header"><h3><i class='bx bx-line-chart'></i> Score Trend</h3></div>
      <div class="panel-body"><div class="chart-container"><canvas id="lineChart"></canvas></div></div>
    </div>

    <div class="panel mt-3">
      <div class="panel-header"><h3><i class='bx bx-list-ul'></i> All Results</h3></div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th>Exam</th><th>Subject</th><th>Date</th><th>Faculty</th>
            <th>Marks</th><th>%</th><th>Rank</th><th>Status</th>
          </tr></thead>
          <tbody id="resBody"><tr><td colspan="8" class="empty-state">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/js/student-portal.js"></script>
<script>
(async () => {
  await ZS.mount({ active: 'results', pageTitle: 'Exam Results' });

  try {
    const r = await ZS.apiGet('/student/results');
    const rows = r.data || [];
    const summary = r.summary || { max: 0, got: 0, percentage: 0 };

    document.getElementById('totalExams').textContent = rows.length;
    document.getElementById('totalGot').textContent = summary.got;
    document.getElementById('totalMax').textContent = summary.max;
    document.getElementById('overallPct').textContent = summary.percentage + '%';

    const body = document.getElementById('resBody');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="bx bx-info-circle"></i><br>No published results yet.</td></tr>';
    } else {
      body.innerHTML = rows.map(x => {
        const pct = x.maxMarks ? Math.round((x.marksObtained / x.maxMarks) * 10000) / 100 : 0;
        return `
          <tr>
            <td><b>${x.examName}</b></td>
            <td>${x.subject}</td>
            <td>${ZS.fmtDate(x.date)}</td>
            <td>${x.teacher}</td>
            <td>${x.marksObtained} / ${x.maxMarks}</td>
            <td>${pct}%</td>
            <td><span class="badge badge-info">#${x.rank || '-'}</span></td>
            <td><span class="badge ${x.attendanceStatus === 'Present' ? 'badge-success' : 'badge-danger'}">${x.attendanceStatus}</span></td>
          </tr>`;
      }).join('');
    }

    const chronological = [...rows].reverse();
    new Chart(document.getElementById('lineChart'), {
      type: 'line',
      data: {
        labels: chronological.map(x => `${x.subject} (${x.examName})`),
        datasets: [{
          label: '% Score',
          data: chronological.map(x => x.maxMarks ? Math.round((x.marksObtained / x.maxMarks) * 10000) / 100 : 0),
          borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.15)',
          tension: .3, fill: true, pointRadius: 5
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
    });
  } catch (err) { ZS.toast(err.message, 'error'); }
})();
</script>
</body>
</html>
